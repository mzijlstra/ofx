[global]
  server role = standalone server
  map to guest = Bad User
  smb ports = 445
  disable netbios = yes
  load printers = no
  log level = 1
[pub]
  path = /srv/pub
  guest ok = yes
  read only = no
  force user = root
[open]
  path = /srv/open
  guest ok = yes
  read only = no
  force user = root
[priv]
  path = /srv/priv
  valid users = tester
  read only = no
  force user = root
