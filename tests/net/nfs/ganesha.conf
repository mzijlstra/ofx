# ofx's test NFS export (tests/net/nfs/Containerfile). Fixed ports: the portmapper tells a client
# these, and the host publishes the same numbers.
NFS_CORE_PARAM {
    NFS_Port = 2049;
    MNT_Port = 20048;
    Enable_NLM = false;
    Enable_RQUOTA = false;
    Protocols = 3, 4;
}
NFS_KRB5 {
    Active_krb5 = false;
}
EXPORT_DEFAULTS {
    Access_Type = RW;
}
EXPORT {
    Export_Id = 1;
    Path = /srv/nfs;
    Pseudo = /srv/nfs;
    Access_Type = RW;
    Squash = No_Root_Squash;
    SecType = sys;
    Protocols = 3, 4;
    Transports = TCP;
    FSAL {
        Name = VFS;
    }
}
LOG {
    Default_Log_Level = WARN;
}
